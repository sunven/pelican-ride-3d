<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>鹈鹕骑行 · Pelican on a Bike</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>" />
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-mark">🦤</div>
    <div class="loader-title">鹈鹕骑行</div>
    <div class="loader-bar"><i></i></div>
    <div class="loader-sub">正在组装自行车与海鸟…</div>
  </div>
</div>

<header id="hud-top">
  <h1>鹈鹕骑行 <span>Pelican on a Bike</span></h1>
  <p id="subtitle">程序化 3D · Three.js · 逆运动学蹬踏 · 实时昼夜</p>
</header>

<section id="panel" class="glass">
  <div class="row">
    <button id="btn-play" class="btn" title="暂停/继续">⏸ <span>暂停</span></button>
    <button id="btn-night" class="btn" title="昼夜切换">🌓 <span>夜晚</span></button>
    <button id="btn-audio" class="btn" title="环境音">🔇 <span>静音</span></button>
    <button id="btn-bell" class="btn" title="按铃">🔔 <span>车铃</span></button>
  </div>
  <div class="row slider-row">
    <label for="spd">速度</label>
    <input id="spd" type="range" min="0" max="3" step="0.05" value="1" />
    <output id="spd-val">1.00x</output>
  </div>
  <div class="row cams">
    <button class="cam active" data-cam="0">自由</button>
    <button class="cam" data-cam="1">环绕</button>
    <button class="cam" data-cam="2">跟拍</button>
    <button class="cam" data-cam="3">特写</button>
  </div>
  <div class="row stats">
    <span>FPS <b id="fps">--</b></span>
    <span>里程 <b id="dist">0</b> m</span>
    <span>踏频 <b id="rpm">0</b></span>
  </div>
</section>

<div id="hint" class="glass">拖拽旋转 · 滚轮缩放 · 点击鹈鹕或车铃 · 空格暂停</div>

<script type="module" src="./main.js"></script>
</body>
</html>
